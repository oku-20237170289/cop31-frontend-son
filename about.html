<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COP31 Türkiye App</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#17401b">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="apple-touch-icon" href="img/icon-apple-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="COP31 TR">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header" id="siteHeader"></header>

  <main class="content-wrap">
    <h1 data-i18n="about_title"></h1>
    <p class="lead" data-i18n="about_lead"></p>

    <h2 data-i18n="about_cop_h"></h2>
    <p data-i18n="about_cop_p"></p>

    <figure class="photo photo-single">
      <img src="img/about-cop.jpg" data-i18n-alt="alt_about_cop" loading="lazy" width="1500" height="1000"
           onerror="this.closest('.photo').classList.add('is-missing')">
      <span class="photo-slot"><span data-i18n="img_missing"></span> <code>img/about-cop.jpg</code></span>
      <figcaption data-i18n="cap_about_cop"></figcaption>
    </figure>

    <h2 data-i18n="about_team_h"></h2>
    <p data-i18n="about_team_p"></p>
    <p class="ext-links">
      <a href="https://www.iklimdd.org" target="_blank" rel="noopener" data-i18n="about_team_link"></a>
      <span aria-hidden="true">·</span>
      <a href="https://www.instagram.com/idd.org.tr/" target="_blank" rel="noopener" data-i18n="about_team_insta"></a>
    </p>

    <figure class="photo photo-single">
      <img src="img/about-team.jpg" data-i18n-alt="alt_about_team" loading="lazy" width="1500" height="1000"
           onerror="this.closest('.photo').classList.add('is-missing')">
      <span class="photo-slot"><span data-i18n="img_missing"></span> <code>img/about-team.jpg</code></span>
      <figcaption data-i18n="cap_about_team"></figcaption>
    </figure>

    <h2 data-i18n="about_mission_h"></h2>
    <p data-i18n="about_mission_p"></p>

    <h2 data-i18n="about_app_h"></h2>
    <p data-i18n="about_app_p"></p>

    <h2 data-i18n="about_vision_h"></h2>
    <p data-i18n="about_vision_p"></p>

    <h2 data-i18n="gt_disclaimer_h"></h2>
    <p data-i18n="gt_disclaimer_p"></p>
    <p class="legal-note" lang="en" data-i18n="gt_disclaimer_legal"></p>
  </main>

  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pwa.js"></script>
  <script>
    applyTranslations();
    renderHeader("about");
  </script>

</body>
</html>
