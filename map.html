<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COP31 Türkiye App</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#17401b">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="apple-touch-icon" href="img/icon-apple-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="COP31 TR">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header" id="siteHeader"></header>

  <div class="app">

    <div class="map-stage">
      <div class="map" id="map"></div>

      <div class="map-controls">
        <div class="filter-box" id="filterBox">
          <button class="filter-toggle" id="filterToggle" onclick="toggleFilters(event)"
                  aria-expanded="false" aria-controls="filterPanel">
            <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true">
              <g stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
                <path d="M3 6h14M3 11h14M3 16h14"/>
              </g>
              <g fill="currentColor">
                <circle cx="13" cy="6" r="2.6"/><circle cx="7" cy="11" r="2.6"/>
                <circle cx="15" cy="16" r="2.6"/>
              </g>
            </svg>
            <span data-i18n="filters_title"></span>
            <span class="chev" aria-hidden="true">›</span>
          </button>

          <div class="filter-panel" id="filterPanel">
            <label class="filter-row">
              <span class="dot dot-cop" aria-hidden="true"></span>
              <span class="filter-name" data-i18n="layer_cop31"></span>
              <input type="checkbox" id="catCop31" checked onchange="refreshMarkers()">
            </label>

            <label class="filter-row">
              <span class="dot dot-tourism" aria-hidden="true"></span>
              <span class="filter-name" data-i18n="layer_tourism"></span>
              <input type="checkbox" id="catSights" checked onchange="refreshMarkers()">
            </label>

            <label class="filter-row">
              <span class="dot dot-eco" aria-hidden="true"></span>
              <span class="filter-name" data-i18n="cat_climate"></span>
              <input type="checkbox" id="catClimate" checked onchange="refreshMarkers()">
            </label>

            <label class="filter-row">
              <span class="dot dot-plant" aria-hidden="true"></span>
              <span class="filter-name" data-i18n="cat_plantbased"></span>
              <input type="checkbox" id="catPlant" checked onchange="refreshMarkers()">
            </label>

            <label class="filter-row">
              <span class="dot dot-local" aria-hidden="true"></span>
              <span class="filter-name" data-i18n="cat_local"></span>
              <input type="checkbox" id="catLocal" checked onchange="refreshMarkers()">
            </label>

            <div class="filter-sep"></div>

            <button class="filter-action" id="noteModeBtn" onclick="toggleNoteMode()"
                    data-i18n="note_start"></button>
          </div>
        </div>

        <button class="map-fab" id="locateBtn" onclick="locateMe()" title="">
          <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="10" cy="10" r="3.2" fill="currentColor"/>
            <circle cx="10" cy="10" r="6.4" fill="none" stroke="currentColor" stroke-width="1.6"/>
            <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
              <path d="M10 1v2.4M10 16.6V19M1 10h2.4M16.6 10H19"/>
            </g>
          </svg>
        </button>
      </div>
    </div>

    <aside class="panel" id="panel">
      <div class="empty" data-i18n="panel_empty"></div>
    </aside>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/translate.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/map.js"></script>
  <script src="js/trace.js"></script>

</body>
</html>
