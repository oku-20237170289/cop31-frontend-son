<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COP31 Türkiye App</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#17401b">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="apple-touch-icon" href="img/icon-apple-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="COP31 TR">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="login-wrap">
    <div class="login-card">

      <div style="text-align: right; margin-bottom: 6px;">
        <button class="ghost small" id="langBtn" onclick="toggleLang()" title="English / Türkçe"></button>
      </div>

      <div class="logo-lockup">
        <span class="idd-logo" role="img" aria-label="İklim Değişmeden Değiş"></span>
        <div class="logo">COP31 Türkiye</div>
      </div>
      <p class="tagline" style="text-align:center;" data-i18n="login_tagline"></p>

      <label for="email" data-i18n="login_email"></label>
      <input id="email" type="email" placeholder="you@example.org" autocomplete="username">

      <label for="password" data-i18n="login_password"></label>
      <input id="password" type="password" autocomplete="current-password">

      <div class="error-msg" id="errorMsg"></div>

      <button type="submit" onclick="handleLogin()" data-i18n="login_submit"></button>

      <p style="text-align:center; margin-top:14px;">
        <a href="map.html" data-i18n="login_back"></a>
      </p>

      <div class="demo-accounts">
        <strong data-i18n="login_demo"></strong><br>
        <span data-i18n="login_demo_admin"></span> — <code>admin@cop31.org</code> / <code>admin123</code><br>
        <span data-i18n="login_demo_user"></span> — <code>user@cop31.org</code> / <code>user123</code>
      </div>

    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pwa.js"></script>
  <script>
    if (getSession() !== null) {
      window.location.href = "map.html";
    }

    applyTranslations();

    document.getElementById("langBtn").textContent = getLang() === "en" ? "TR" : "EN";

    async function handleLogin() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const errorBox = document.getElementById("errorMsg");

      if (email.trim() === "" || password === "") {
        errorBox.textContent = t("login_err_empty");
        errorBox.style.display = "block";
        return;
      }

      const res = await login(email, password);
      if (res && res.ok) {
        let back = "map.html";
        try {
          const saved = localStorage.getItem("cop31_return");
          if (saved && /^[a-z]+\.html$/.test(saved)) back = saved;
          localStorage.removeItem("cop31_return");
        } catch (err) { }
        window.location.href = back;
      } else {
        errorBox.textContent = (res && res.error) || t("login_err_wrong");
        errorBox.style.display = "block";
      }
    }

    document.addEventListener("keydown", function (e) {
      if (e.key === "Enter") handleLogin();
    });
  </script>

</body>
</html>
