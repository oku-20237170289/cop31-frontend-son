<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COP31 Türkiye App</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#17401b">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="apple-touch-icon" href="img/icon-apple-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="COP31 TR">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="welcome">
    <div class="welcome-inner">

      <span class="idd-logo welcome-logo" role="img" aria-label="İklim Değişmeden Değiş"></span>

      <p class="wel-kicker" data-i18n="wel_kicker"></p>
      <h1 data-i18n="wel_head"></h1>
      <p class="wel-sub" data-i18n="wel_sub"></p>

      <div class="wel-actions">
        <a class="btn-primary" href="map.html" data-i18n="wel_cta_map"></a>
        <a class="btn-quiet" href="login.html" data-i18n="wel_cta_signin"></a>
        <button class="btn-quiet" id="installBtn" hidden onclick="installApp()" data-i18n="pwa_install"></button>
      </div>

      <div class="wel-features">
        <div class="wel-feature">
          <span class="dot dot-cop" aria-hidden="true"></span>
          <h2 data-i18n="wel_f1_h"></h2>
          <p data-i18n="wel_f1_p"></p>
        </div>
        <div class="wel-feature">
          <span class="dot dot-eco" aria-hidden="true"></span>
          <h2 data-i18n="wel_f2_h"></h2>
          <p data-i18n="wel_f2_p"></p>
        </div>
        <div class="wel-feature">
          <span class="dot dot-tourism" aria-hidden="true"></span>
          <h2 data-i18n="wel_f3_h"></h2>
          <p data-i18n="wel_f3_p"></p>
        </div>
      </div>

      <p class="wel-by">
        <a href="https://www.iklimdd.org" target="_blank" rel="noopener" data-i18n="wel_by"></a>
      </p>

      <button class="ghost small wel-lang" onclick="toggleLang()" id="welLang"
              title="English / Türkçe"></button>

    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pwa.js"></script>
  <script>
    applyTranslations();
    document.getElementById("welLang").textContent = getLang() === "en" ? "TR" : "EN";
  </script>

</body>
</html>
